<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب الأكبر للعقارات والخدمات القانونية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- الهيدر واللوغو الداخلي -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-indigo-700 p-2 rounded-xl text-yellow-400 text-xl shadow-inner">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">مكتب الأكبر</h1>
                    <p class="text-xs text-indigo-200">للعقارات والخدمات القانونية</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse">
                <span class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-100 border border-indigo-700">إدارة القضايا والعقارات</span>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        
        <!-- أدوات البحث والإضافة -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <!-- خانة البحث -->
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="بحث عن موكل، عقار، أو معاملة..." 
                    class="w-full pr-10 pl-4 py-2.5 bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <!-- زر الإضافة -->
            <button onclick="openAddModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center space-x-2 space-x-reverse text-sm">
                <i class="fa-solid fa-plus"></i>
                <span>إضافة سجل جديد</span>
            </button>
        </div>

        <!-- جدول البيانات -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="py-3.5 px-4 font-semibold">التسلسل</th>
                            <th class="py-3.5 px-4 font-semibold">اسم الموكل / الطرف</th>
                            <th class="py-3.5 px-4 font-semibold">نوع المعاملة / القضية</th>
                            <th class="py-3.5 px-4 font-semibold">التفاصيل</th>
                            <th class="py-3.5 px-4 font-semibold">الحالة</th>
                            <th class="py-3.5 px-4 font-semibold text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- بيانات تجريبية تفاعلية -->
                        <tr class="hover:bg-slate-50 transition">
                            <td class="py-3 px-4 text-slate-500">1</td>
                            <td class="py-3 px-4 font-medium text-slate-800">محمد عبد الله</td>
                            <td class="py-3 px-4 text-slate-600">تسجيل عقار / طابو</td>
                            <td class="py-3 px-4 text-slate-500">قطعة أرض رقم 45</td>
                            <td class="py-3 px-4"><span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-medium">قيد الإجراء</span></td>
                            <td class="py-3 px-4 text-center space-x-2 space-x-reverse">
                                <button class="text-indigo-600 hover:text-indigo-800 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="text-rose-600 hover:text-rose-800 p-1"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة © 2026 - مكتب الأكبر للعقارات والخدمات القانونية
    </footer>

    <script>
        // سكريبت بسيط للتفاعل المستقبلي
        function openAddModal() {
            alert('تم تفعيل زر الإضافة بنجاح! سيتم ربطه بقاعدة البيانات المصغرة.');
        }
    </script>
</body>
</html>
